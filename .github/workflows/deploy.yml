name: CI-CD

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - name: Deploy locally on the server
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/mpt-practice
          git fetch origin main
          git reset --hard origin/main
          chmod +x scripts/*.sh
          ./scripts/deploy.sh "${{ github.sha }}"
