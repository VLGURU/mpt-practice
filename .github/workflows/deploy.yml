name: Deploy (self-hosted)

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64]

    steps:
      - name: Mark repo as safe (git)
        run: git config --global --add safe.directory /opt/mpt-practice

      - name: Deploy on server
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/mpt-practice
          chmod +x scripts/*.sh
          ./scripts/deploy.sh "${{ github.sha }}"
